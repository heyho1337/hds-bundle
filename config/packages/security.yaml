security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            custom_authenticator: App\Security\ApiKeyAuthenticator

        # Admin firewall - strictly for /admin
        admin:
            pattern: ^/admin
            lazy: true
            stateless: false
            provider: app_user_provider
            entry_point: form_login

            form_login:
                login_path: admin_login        # e.g. route for /admin/login
                check_path: admin_login        # must match login_path route name
                default_target_path: /admin
                enable_csrf: true

            logout:
                path: admin_logout             # route handling admin logout
                target: admin_login

            custom_authenticators:
                - App\Security\UserAuthenticator
                - App\Security\GoogleAuth

        # Setup firewall - strictly for /setup
        setup:
            pattern: ^/setup
            lazy: true
            stateless: false
            provider: app_user_provider
            entry_point: form_login

            form_login:
                login_path: setup_login
                check_path: setup_login
                default_target_path: /setup
                enable_csrf: true

            logout:
                path: setup_logout
                target: setup_login

            custom_authenticators:
                - App\Security\SetupAuthenticator
                - App\Security\GoogleAuth

    access_control:
        # Setup access control
        - { path: ^/setup/registration, roles: PUBLIC_ACCESS }
        - { path: ^/setup/login, roles: PUBLIC_ACCESS }
        - { path: ^/setup, roles: ROLE_SETUP }

        # Admin access control
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

        # API (optional)
        #- { path: ^/api, roles: ROLE_API }
        - { path: ^/api, roles: PUBLIC_ACCESS }
