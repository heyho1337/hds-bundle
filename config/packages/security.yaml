security:
    # Password Hasher Configuration
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User Provider (loads users from database via Doctrine)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~  # enable JWT for API routes
            refresh_jwt:
                check_path: /api/token/refresh

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            entry_point: form_login

            form_login:
                login_path: app_login                # route name of your login page route
                check_path: app_login                # same route if form posts to itself
                default_target_path: /admin          # redirect after successful login
                enable_csrf: true

            logout:
                path: app_logout                     # route name for logout
                target: app_login                    # where to redirect after logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800                     # 1 week in seconds
                path: /
                # always_remember_me: true           # Optional: enable without checkbox

    # Access Control
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }    # Allow anyone to see login page
        - { path: ^/admin, roles: ROLE_ADMIN }       # Restrict /admin to ROLE_ADMIN users
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        #- { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/api/(login|token/refresh), roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4           # Lowest possible value for bcrypt
                time_cost: 3      # Lowest for argon
                memory_cost: 10   # Lowest for argon
