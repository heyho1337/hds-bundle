# config/packages/security.yaml

security:
    # Password Hasher Configuration
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User Provider (used for admin login)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # API firewall using custom API key authenticator
        api:
            pattern: ^/api
            stateless: true
            custom_authenticator: App\Security\ApiKeyAuthenticator

        # Main firewall for admin UI etc.
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            entry_point: form_login

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /admin
                enable_csrf: true

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Access Control Rules
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }       # Public login page
        - { path: ^/admin, roles: ROLE_ADMIN }          # Admin pages restricted to ROLE_ADMIN only
        - { path: ^/api, roles: ROLE_API }               # API access limited to authenticated API key users